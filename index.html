
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.A.C. Lakshan | Links</title>

<style>
    :root {
        --red: #d71920;
        --red-light: #ff3b42;
        --dark: #171717;
        --gray: #666;
        --light: #f3f3f3;
        --white: #ffffff;

        --glass: rgba(255, 255, 255, 0.72);
        --glass-border: rgba(255, 255, 255, 0.75);
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        min-height: 100vh;

        font-family:
            Inter,
            Poppins,
            Arial,
            Helvetica,
            sans-serif;

        color: var(--dark);

        display: grid;
        place-items: center;

        padding: 24px;

        overflow-x: hidden;

        background:
            radial-gradient(
                circle at 15% 20%,
                rgba(215, 25, 32, 0.15),
                transparent 28%
            ),
            radial-gradient(
                circle at 85% 80%,
                rgba(215, 25, 32, 0.10),
                transparent 30%
            ),
            linear-gradient(
                135deg,
                #fafafa,
                #eeeeee
            );

        position: relative;
    }


    /* =========================
       BACKGROUND BLOBS
       ========================= */

    body::before,
    body::after {
        content: "";
        position: fixed;

        width: 260px;
        height: 260px;

        border-radius: 50%;

        background: rgba(215, 25, 32, 0.12);

        filter: blur(70px);

        z-index: -1;

        pointer-events: none;
    }

    body::before {
        top: -100px;
        left: -80px;
    }

    body::after {
        bottom: -120px;
        right: -70px;
    }


    /* =========================
       MAIN CARD
       ========================= */

    .card {
        width: min(100%, 500px);

        position: relative;

        padding: 48px 30px 30px;

        text-align: center;

        border-radius: 28px;

        background: var(--glass);

        border: 1px solid var(--glass-border);

        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);

        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.12),
            inset 0 1px 0 rgba(255, 255, 255, 0.8);

        overflow: hidden;

        animation: cardAppear 0.7s ease forwards;
    }


    /* Red top accent */

    .card::before {
        content: "";

        position: absolute;

        top: 0;
        left: 0;

        width: 100%;
        height: 5px;

        background:
            linear-gradient(
                90deg,
                var(--red),
                var(--red-light),
                var(--red)
            );
    }


    /* Subtle glass highlight */

    .card::after {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -100px;
        right: -80px;

        border-radius: 50%;

        background: rgba(255, 255, 255, 0.45);

        filter: blur(5px);

        pointer-events: none;
    }


    /* =========================
       AVATAR
       ========================= */

    .avatar {
        width: 86px;
        height: 86px;

        margin: 0 auto 20px;

        display: grid;
        place-items: center;

        border-radius: 50%;

        background:
            linear-gradient(
                145deg,
                rgba(255,255,255,0.9),
                rgba(255,255,255,0.45)
            );

        border: 1px solid rgba(255,255,255,0.85);

        box-shadow:
            0 12px 30px rgba(0,0,0,0.10),
            inset 0 1px 2px rgba(255,255,255,0.9);

        color: var(--red);

        font-size: 25px;

        font-weight: 800;

        letter-spacing: 1px;

        position: relative;

        overflow: hidden;
    }


    /* Optional initials */

    .avatar::before {
        content: "ML";
    }


    /* =========================
       NAME
       ========================= */

    h1 {
        margin: 0;

        font-size: clamp(27px, 6vw, 36px);

        font-weight: 800;

        letter-spacing: 0.8px;

        line-height: 1.15;
    }


    /* =========================
       ROLE
       ========================= */

    .role {
        margin: 10px 0 10px;

        color: var(--red);

        font-weight: 700;

        font-size: 15px;

        letter-spacing: 0.2px;
    }


    /* =========================
       INTRO
       ========================= */

    .intro {
        margin: 0 auto 30px;

        max-width: 390px;

        color: var(--gray);

        line-height: 1.65;

        font-size: 14px;
    }


    /* =========================
       LINKS
       ========================= */

    .links {
        display: grid;

        gap: 13px;
    }


    .link {
        min-height: 58px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 11px;

        padding: 14px 20px;

        border-radius: 15px;

        text-decoration: none;

        font-weight: 700;

        color: var(--dark);

        background:
            rgba(255,255,255,0.55);

        border: 1px solid rgba(255,255,255,0.9);

        box-shadow:
            0 7px 20px rgba(0,0,0,0.05),
            inset 0 1px 0 rgba(255,255,255,0.9);

        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease,
            background 0.25s ease,
            border-color 0.25s ease;
    }


    .link:hover {
        transform: translateY(-3px);

        border-color: rgba(215,25,32,0.35);

        background:
            rgba(255,255,255,0.85);

        box-shadow:
            0 12px 28px rgba(0,0,0,0.08),
            0 4px 15px rgba(215,25,32,0.08);
    }


    .link:active {
        transform: translateY(-1px) scale(0.99);
    }


    /* =========================
       PRIMARY LINK
       ========================= */

    .link.primary {
        color: white;

        border-color: var(--red);

        background:
            linear-gradient(
                135deg,
                var(--red),
                #b90f16
            );

        box-shadow:
            0 10px 25px rgba(215,25,32,0.22);
    }


    .link.primary:hover {
        background:
            linear-gradient(
                135deg,
                var(--red-light),
                var(--red)
            );

        border-color: var(--red-light);

        box-shadow:
            0 14px 30px rgba(215,25,32,0.28);
    }


    /* =========================
       ICONS
       ========================= */

    .icon {
        width: 25px;

        display: inline-flex;

        justify-content: center;

        align-items: center;

        font-size: 18px;

        font-weight: 800;
    }


    .link:not(.primary) .icon {
        color: var(--red);
    }


    /* =========================
       FOOTER
       ========================= */

    footer {
        margin-top: 30px;

        color: #999;

        font-size: 12px;

        letter-spacing: 0.3px;
    }


    /* =========================
       ANIMATION
       ========================= */

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(18px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 480px) {

        body {
            padding: 16px;
        }

        .card {
            padding:
                40px 20px 25px;

            border-radius: 24px;
        }

        .avatar {
            width: 78px;
            height: 78px;
        }

        h1 {
            font-size: 27px;
        }

        .intro {
            font-size: 13.5px;
            margin-bottom: 25px;
        }

        .link {
            min-height: 55px;
        }
    }


    /* =========================
       REDUCED MOTION
       ========================= */

    @media (prefers-reduced-motion: reduce) {

        html {
            scroll-behavior: auto;
        }

        .card,
        .link {
            animation: none;
            transition: none;
        }
    }

</style>
</head>


<body>

    <main class="card">

        <div class="avatar"></div>

        <h1>M.A.C. LAKSHAN</h1>

        <p class="role">
            Graphic Designer · Office Support
        </p>

        <p class="intro">
            Welcome! Here you can find my professional links,
            portfolio and contact information.
        </p>


        <section class="links">

            <!-- LinkedIn -->
            <a
                class="link primary"
                href="https://www.linkedin.com/in/chamuditha-lakshan-266655377"
                target="_blank"
                rel="noopener"
            >
                <span class="icon">in</span>
                LinkedIn Profile
            </a>


            <!-- Email -->
            <a
                class="link"
                href="mailto:Chamudithalakshan264@gmail.com"
            >
                <span class="icon">✉</span>
                Send Me an Email
            </a>


            <!-- Phone -->
            <a
                class="link"
                href="tel:+94769631658"
            >
                <span class="icon">☎</span>
                Contact Me
            </a>

        </section>


        <footer>
            © 2026 M.A.C. Lakshan
        </footer>

    </main>

</body>
</html>
